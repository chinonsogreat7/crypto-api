openapi: 3.0.3
info:
  title: Crypto Trade API
  version: 1.0.0
  description: Sandbox crypto trading API for students. Covers market data, wallets, buy, sell, swap, transactions, KYC, and admin operations.
servers:
  - url: /
    description: Current API host
  - url: http://localhost:4200
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health checks and service metadata.
  - name: Auth
    description: Registration, login, OTP, authenticator 2FA, and KYC submission.
  - name: Market
    description: Asset catalog, trending assets, and live market prices with simulator fallback.
  - name: Profile
    description: Customer profile, settings, watchlist, devices, and notifications.
  - name: Wallet
    description: Wallet balances, deposits, withdrawals, and transaction history.
  - name: Trade
    description: Quote preview and trade execution for buy, sell, and swap flows.
  - name: Admin
    description: Admin dashboard, users, KYC review, withdrawals, assets, and fees.
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: Check server health
      responses:
        "200":
          description: API status
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/HealthResponse"
  /assets/{fileName}:
    get:
      tags: [System]
      security: []
      summary: Get a backend-hosted crypto logo SVG
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
          example: btc.svg
      responses:
        "200":
          description: SVG logo file
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
  /auth/validate-signup:
    post:
      tags: [Auth]
      security: []
      summary: Validate signup email and phone availability
      description: Use this before registration to show field-level signup validation. Send email, phone, or both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                email:
                  type: string
                  example: ada@example.com
                phone:
                  type: string
                  description: International phone number in E.164 format.
                  example: "+2348010000001"
      responses:
        "200":
          description: Field-level validation and availability status
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/SignupValidationResponse"
        "400":
          description: Missing email and phone
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  example: student@cryptoclass.test
                phone:
                  type: string
                  description: International phone number in E.164 format.
                  example: "+2348010000001"
                password:
                  type: string
                  minLength: 8
                  example: password123
      responses:
        "201":
          description: Registered user. Email verification is required before tokens are issued.
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/RegisterResponse"
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginType, identifier, password]
              properties:
                loginType:
                  type: string
                  enum: [email, phone]
                  description: Tells the API whether identifier should be matched against email or phone.
                  example: email
                identifier:
                  type: string
                  description: Email address when loginType is email, or phone number when loginType is phone.
                  example: student@cryptoclass.test
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: User tokens, or a 2FA challenge
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
                twoFactorRequired:
                  $ref: "#/components/examples/TwoFactorChallengeResponse"
  /auth/session:
    get:
      tags: [Auth]
      summary: Check the current bearer token session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      authenticated: true
                      user:
                        id: usr_student
                        fullName: Ada Student
                        email: student@cryptoclass.test
                        role: customer
                      accessToken: demo-user-token
                      token: demo-user-token
                      refreshToken: demo-user-refresh-token
                      tokenType: Bearer
                      expiresAt: "2099-01-01T00:00:00.000Z"
                      expiresInSeconds: 2300000000
                      refreshTokenExpiresAt: "2099-01-31T00:00:00.000Z"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current bearer token
      responses:
        "200":
          description: Logout status
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      loggedOut: true
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate tokens with a refresh token
      description: Returns a new access token and a new refresh token. The previous refresh token is no longer valid after this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: demo-user-refresh-token
      responses:
        "200":
          description: New tokens for the same user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Start authenticator app setup
      responses:
        "200":
          description: TOTP secret and QR URI
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorSetupResponse"
  /auth/2fa/status:
    get:
      tags: [Auth]
      summary: Get authenticator 2FA and recovery-code status
      description: Returns safe metadata only. Recovery codes are shown once on enable/regenerate and are not readable later because the API stores only hashed versions.
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorStatusResponse"
  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable authenticator app 2FA
      description: Returns one-time recovery codes. Store them on the client or show them once to the user; the API stores only hashed versions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorEnabledResponse"
  /auth/2fa/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify a login 2FA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId]
              properties:
                challengeId:
                  type: string
                  example: 2fa_abc123
                code:
                  type: string
                  example: "123456"
                recoveryCode:
                  type: string
                  description: Use one recovery code instead of an authenticator code when the user lost their authenticator app.
                  example: "A1B2C-D3E4F"
      responses:
        "200":
          description: User, access token, and refresh token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
  /auth/2fa/recovery-codes/regenerate:
    post:
      tags: [Auth]
      summary: Regenerate 2FA recovery codes
      description: Invalidates all old recovery codes and returns a fresh set. Requires password plus a current authenticator code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                  example: password123
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Fresh recovery codes
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorRecoveryCodesResponse"
  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable authenticator app 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: password123
                code:
                  type: string
                  example: "123456"
                recoveryCode:
                  type: string
                  example: "A1B2C-D3E4F"
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorDisabledResponse"
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Request demo OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: student@cryptoclass.test
      responses:
        "200":
          description: Demo OTP code
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/OtpRequestResponse"
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify demo OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: student@cryptoclass.test
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Email verified, with user tokens
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/OtpVerifyResponse"
  /auth/kyc:
    post:
      tags: [Auth]
      summary: Submit KYC for review
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, country, documentType, documentNumber, selfieImageUrl, documentImageUrl]
              properties:
                legalName:
                  type: string
                  example: Ada Student
                country:
                  type: string
                  example: Nigeria
                documentType:
                  type: string
                  enum: [national_id, passport, drivers_license]
                  example: national_id
                documentNumber:
                  type: string
                  example: NIN-000-000
                selfieImageUrl:
                  type: string
                  example: https://example.com/uploads/ada-selfie.jpg
                documentImageUrl:
                  type: string
                  description: Front image URL for the identity document.
                  example: https://example.com/uploads/ada-national-id-front.jpg
                documentBackImageUrl:
                  type: string
                  nullable: true
                  description: Optional back image URL for documents that have a reverse side.
                  example: https://example.com/uploads/ada-national-id-back.jpg
      responses:
        "201":
          description: KYC submission
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/KycResponse"
  /auth/kyc/uploads:
    post:
      tags: [Auth]
      summary: Create KYC upload instructions
      description: Returns demo local upload instructions by default, or signed Cloudinary direct-upload instructions when Cloudinary environment variables are configured. Cloudinary uploads are grouped by user in kyc/{userId}/{documentKind}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType]
              properties:
                fileName:
                  type: string
                  example: student-national-id.png
                contentType:
                  type: string
                  example: image/png
                documentKind:
                  type: string
                  enum: [selfie, document_front, document_back]
                  example: document_front
      responses:
        "201":
          description: Upload instructions
          content:
            application/json:
              examples:
                demoStorage:
                  value:
                    data:
                      uploadId: upload_abc123
                      provider: demo_local_storage
                      storageKey: kyc/usr_student/document_front/upload_abc123-student-national-id.png
                      uploadUrl: /storage/uploads/kyc/usr_student/document_front/upload_abc123-student-national-id.png
                      publicUrl: /storage/files/kyc/usr_student/document_front/upload_abc123-student-national-id.png
                      method: PUT
                      headers:
                        content-type: image/png
                      expiresAt: "2026-05-20T13:10:00.000Z"
                cloudinary:
                  value:
                    data:
                      uploadId: upload_abc123
                      provider: cloudinary
                      cloudName: dbh1f4yce
                      storageKey: kyc/usr_student/document_front/upload_abc123-student-national-id
                      folder: kyc/usr_student/document_front
                      publicId: kyc/usr_student/document_front/upload_abc123-student-national-id
                      uploadUrl: https://api.cloudinary.com/v1_1/dbh1f4yce/auto/upload
                      publicUrl: https://res.cloudinary.com/dbh1f4yce/image/upload/kyc/usr_student/document_front/upload_abc123-student-national-id
                      method: POST
                      headers: {}
                      formFields:
                        folder: kyc/usr_student/document_front
                        overwrite: "false"
                        public_id: upload_abc123-student-national-id
                        timestamp: 1779282600
                        api_key: "********"
                        signature: "********"
                      expiresAt: "2026-05-20T13:10:00.000Z"
  /market/assets:
    get:
      tags: [Market]
      security: []
      summary: List supported crypto assets
      parameters:
        - in: query
          name: q
          required: false
          description: Optional search text for asset name or symbol.
          schema:
            type: string
          example: btc
        - in: query
          name: search
          required: false
          description: Alias for q, useful for search inputs.
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
          example: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [symbol, priceUsd, change24h, minBuyUsd]
          example: priceUsd
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
          example: desc
        - in: query
          name: include
          required: false
          description: Include optional list-row extras. Use `sparkline` to render small charts without fetching each asset detail.
          schema:
            type: string
            enum: [sparkline]
          example: sparkline
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
                withSparkline:
                  $ref: "#/components/examples/AssetListWithSparklineResponse"
  /market/assets/{symbol}:
    get:
      tags: [Market]
      security: []
      summary: Get asset details and demo chart data
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetDetailResponse"
  /market/assets/{symbol}/candles:
    get:
      tags: [Market]
      security: []
      summary: Get simulated candlestick chart data
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - in: query
          name: interval
          required: false
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 1d]
          example: 1m
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          example: 50
      responses:
        "200":
          description: Candle list
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/MarketCandlesResponse"
  /market/assets/{symbol}/order-book:
    get:
      tags: [Market]
      security: []
      summary: Get simulated order book levels
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - in: query
          name: levels
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 12
      responses:
        "200":
          description: Order book
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/MarketOrderBookResponse"
  /market/assets/{symbol}/trades:
    get:
      tags: [Market]
      security: []
      summary: Get simulated recent market trades
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 30
      responses:
        "200":
          description: Recent market trades
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/MarketTradesResponse"
  /market/trending:
    get:
      tags: [Market]
      security: []
      summary: List trending assets
      parameters:
        - in: query
          name: include
          required: false
          description: Trending assets include `sparkline` by default. Use `none` for the lighter row response.
          schema:
            type: string
            enum: [sparkline, none]
          example: sparkline
      responses:
        "200":
          description: Trending assets
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TrendingAssetsResponse"
  /market/prices:
    get:
      tags: [Market]
      security: []
      summary: List live market prices
      responses:
        "200":
          description: Live price feed with provider metadata
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/PriceFeedResponse"
  /market/stream:
    get:
      tags: [Market]
      security: []
      summary: Stream live market prices
      description: Server-Sent Events stream for mobile list prices, sparklines, and lightweight chart refreshes. Events are named `prices`.
      responses:
        "200":
          description: SSE stream of live price rows
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: prices
                data: {"data":[{"symbol":"BTC","name":"Bitcoin","priceUsd":64200.5,"change24h":2.1,"updatedAt":"2026-05-25T10:00:00.000Z"}],"meta":{"count":1,"market":{"mode":"live_market","source":"CoinGecko simple price API","lastUpdatedAt":"2026-05-25T10:00:00.000Z","tickIntervalMs":60000,"lastError":null}}}
  /me:
    get:
      tags: [Profile]
      summary: Get current profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/ProfileResponse"
    patch:
      tags: [Profile]
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 80
                  example: Ada Student
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{7,14}$'
                  description: International phone number in E.164 format.
                  example: "+2348010000001"
                avatarUrl:
                  type: string
                  nullable: true
                  example: https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=240&h=240&fit=crop&crop=faces
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/ProfileResponse"
  /me/settings:
    get:
      tags: [Profile]
      summary: Get user settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/SettingsResponse"
    patch:
      tags: [Profile]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                theme:
                  type: string
                  enum: [light, dark, system]
                  example: dark
                pushNotifications:
                  type: boolean
                  example: true
                biometricEnabled:
                  type: boolean
                  example: false
                fiatCurrency:
                  type: string
                  enum: [USD, NGN, EUR, GBP, CAD, AUD, JPY, CHF]
                  example: USD
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/SettingsResponse"
  /me/pin:
    patch:
      tags: [Profile]
      summary: Update transaction PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPin, newPin]
              properties:
                currentPin:
                  type: string
                  example: "0000"
                newPin:
                  type: string
                  minLength: 4
                  maxLength: 6
                  example: "1234"
      responses:
        "200":
          description: PIN updated
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/UpdatedResponse"
  /me/devices:
    get:
      tags: [Profile]
      summary: List registered devices
      responses:
        "200":
          description: Registered push devices for the current user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DeviceListResponse"
    post:
      tags: [Profile]
      summary: Register an Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expoPushToken, platform]
              properties:
                expoPushToken:
                  type: string
                  example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
                platform:
                  type: string
                  enum: [ios, android, web]
                  example: ios
      responses:
        "200":
          description: Registered device token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DeviceTokenResponse"
  /me/devices/{deviceId}:
    delete:
      tags: [Profile]
      summary: Remove a registered device
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
          example: device_abc123
      responses:
        "200":
          description: Device removed
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DeviceDeletedResponse"
  /me/watchlist:
    get:
      tags: [Profile]
      summary: List watchlist assets
      responses:
        "200":
          description: Watchlist assets
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
  /me/watchlist/{symbol}:
    post:
      tags: [Profile]
      summary: Add asset to watchlist
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Updated watchlist symbols
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WatchlistSymbolsResponse"
    delete:
      tags: [Profile]
      summary: Remove asset from watchlist
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Updated watchlist symbols
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WatchlistSymbolsResponse"
  /me/price-alerts:
    get:
      tags: [Profile]
      summary: List price alerts
      responses:
        "200":
          description: Price alerts
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      - id: alert_btc_above
                        userId: usr_student
                        assetSymbol: BTC
                        direction: above
                        targetPriceUsd: 70000
                        isActive: true
                        triggeredAt: null
                        createdAt: "2026-05-20T12:00:00.000Z"
                        asset:
                          symbol: BTC
                          name: Bitcoin
                    meta:
                      count: 1
                      active: 1
    post:
      tags: [Profile]
      summary: Create a price alert
      description: If the current simulated price already crosses the target, the alert triggers immediately and creates a notification. Otherwise, it is evaluated during market ticks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetSymbol, direction, targetPriceUsd]
              properties:
                assetSymbol:
                  type: string
                  example: BTC
                direction:
                  type: string
                  enum: [above, below]
                  example: above
                targetPriceUsd:
                  type: number
                  example: 72000
      responses:
