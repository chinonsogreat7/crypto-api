openapi: 3.0.3
info:
  title: Crypto Trade API
  version: 1.0.0
  description: Sandbox crypto trading API for students. Covers market data, wallets, buy, sell, swap, transactions, KYC, and admin operations.
servers:
  - url: /
    description: Current API host
  - url: http://localhost:4200
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Check server health
      responses:
        "200":
          description: API status
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/HealthResponse"
  /auth/register:
    post:
      security: []
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  example: student@cryptoclass.test
                phone:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: User and token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
  /auth/login:
    post:
      security: []
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: student@cryptoclass.test
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: User and token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
  /auth/otp/request:
    post:
      security: []
      summary: Request demo OTP
      responses:
        "200":
          description: Demo OTP code
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/OtpRequestResponse"
  /auth/otp/verify:
    post:
      security: []
      summary: Verify demo OTP
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/OtpVerifyResponse"
  /auth/kyc:
    post:
      summary: Submit KYC for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, country, documentType, documentNumber]
              properties:
                legalName:
                  type: string
                  example: Ada Student
                country:
                  type: string
                  example: Nigeria
                documentType:
                  type: string
                  enum: [national_id, passport, drivers_license]
                  example: national_id
                documentNumber:
                  type: string
                  example: NIN-000-000
                selfieImageUrl:
                  type: string
                  example: https://example.com/uploads/ada-selfie.jpg
                documentImageUrl:
                  type: string
                  example: https://example.com/uploads/ada-national-id.jpg
      responses:
        "201":
          description: KYC submission
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/KycResponse"
  /market/assets:
    get:
      security: []
      summary: List supported crypto assets
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
  /market/assets/{symbol}:
    get:
      security: []
      summary: Get asset details and demo chart data
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetDetailResponse"
  /market/trending:
    get:
      security: []
      summary: List trending assets
      responses:
        "200":
          description: Trending assets
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
  /market/prices:
    get:
      security: []
      summary: List simulated live market prices
      responses:
        "200":
          description: Simulated live price feed
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/PriceFeedResponse"
  /me:
    get:
      summary: Get current profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/ProfileResponse"
    patch:
      summary: Update current profile
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/ProfileResponse"
  /me/settings:
    get:
      summary: Get user settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/SettingsResponse"
    patch:
      summary: Update user settings
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/SettingsResponse"
  /me/pin:
    patch:
      summary: Update transaction PIN
      responses:
        "200":
          description: PIN updated
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/UpdatedResponse"
  /me/devices:
    post:
      summary: Register an Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expoPushToken, platform]
              properties:
                expoPushToken:
                  type: string
                  example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
                platform:
                  type: string
                  enum: [ios, android, web]
                  example: ios
      responses:
        "200":
          description: Registered device token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DeviceTokenResponse"
  /me/watchlist:
    get:
      summary: List watchlist assets
      responses:
        "200":
          description: Watchlist assets
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
  /me/watchlist/{symbol}:
    post:
      summary: Add asset to watchlist
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Updated watchlist symbols
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WatchlistSymbolsResponse"
    delete:
      summary: Remove asset from watchlist
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Updated watchlist symbols
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WatchlistSymbolsResponse"
  /me/notifications:
    get:
      summary: List user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/NotificationsResponse"
  /me/notifications/{notificationId}/read:
    patch:
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/NotificationResponse"
  /me/notifications/read-all:
    patch:
      summary: Mark all notifications as read
      responses:
        "200":
          description: Update status
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/UpdatedResponse"
  /wallet:
    get:
      summary: Get wallet balances and portfolio value
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WalletResponse"
  /wallet/deposit-addresses:
    get:
      summary: List deposit addresses
      responses:
        "200":
          description: Deposit addresses
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DepositAddressesResponse"
  /wallet/deposit-addresses/{symbol}:
    get:
      summary: Get a deposit address and QR payload
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Deposit address
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DepositAddressResponse"
  /wallet/transactions:
    get:
      summary: List user transactions
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TransactionListResponse"
  /wallet/transactions/{transactionId}:
    get:
      summary: Get transaction details
      parameters:
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TransactionResponse"
  /wallet/deposit/simulate:
    post:
      summary: Simulate a sandbox USD deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  example: 500
      responses:
        "201":
          description: Deposit transaction
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DepositResponse"
  /wallet/withdrawals:
    post:
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetSymbol, amount, address, network]
              properties:
                assetSymbol:
                  type: string
                  example: ETH
                amount:
                  type: number
                  example: 0.05
                address:
                  type: string
                network:
                  type: string
      responses:
        "201":
          description: Withdrawal request
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WithdrawalResponse"
  /trade/quotes:
    post:
      summary: Create a buy, sell, or swap quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, fromAsset, toAsset, fromAmount]
              properties:
                type:
                  type: string
                  enum: [buy, sell, swap]
                  example: swap
                fromAsset:
                  type: string
                  example: ETH
                toAsset:
                  type: string
                  example: USDC
                fromAmount:
                  type: number
                  example: 0.1
      responses:
        "201":
          description: Quote
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/QuoteResponse"
  /trade/execute:
    post:
      summary: Execute a quote with transaction PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, pin]
              properties:
                quoteId:
                  type: string
                pin:
                  type: string
                  example: "1234"
      responses:
        "201":
          description: Completed sandbox trade
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TradeExecutionResponse"
  /admin/dashboard:
    get:
      summary: Admin metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AdminDashboardResponse"
  /admin/users:
    get:
      summary: List customers
      responses:
        "200":
          description: Customers
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AdminUsersResponse"
  /admin/users/{userId}:
    get:
      summary: Get customer detail, wallet, and transactions
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AdminUserDetailResponse"
  /admin/kyc:
    get:
      summary: List KYC submissions
      responses:
        "200":
          description: KYC submissions
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/KycListResponse"
  /admin/kyc/{kycId}:
    patch:
      summary: Approve or reject KYC
      parameters:
        - in: path
          name: kycId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
                reviewerNote:
                  type: string
                  example: Approved for classroom demo.
      responses:
        "200":
          description: Reviewed KYC
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/KycResponse"
  /admin/transactions:
    get:
      summary: List all transactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TransactionListResponse"
  /admin/withdrawals:
    get:
      summary: List withdrawal requests
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WithdrawalListResponse"
  /admin/withdrawals/{withdrawalId}:
    patch:
      summary: Approve or reject a withdrawal
      parameters:
        - in: path
          name: withdrawalId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
                reviewerNote:
                  type: string
                  example: Approved after review.
      responses:
        "200":
          description: Reviewed withdrawal
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WithdrawalResponse"
  /admin/assets:
    get:
      summary: List managed assets
      responses:
        "200":
          description: Assets
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
    post:
      summary: Add a managed asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, name, network, priceUsd]
              properties:
                symbol:
                  type: string
                  example: SOL
                name:
                  type: string
                  example: Solana
                network:
                  type: string
                  example: Solana Devnet
                priceUsd:
                  type: number
                  example: 142.25
                change24h:
                  type: number
                  example: 2.4
                isActive:
                  type: boolean
                  example: true
                minBuyUsd:
                  type: number
                  example: 10
                minSellUsd:
                  type: number
                  example: 10
                iconUrl:
                  type: string
                  example: /assets/sol.svg
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetResponse"
  /admin/assets/{symbol}:
    patch:
      summary: Pause or allow an asset
      parameters:
        - $ref: "#/components/parameters/Symbol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
                  example: false
      responses:
        "200":
          description: Updated asset availability
          content:
            application/json:
              examples:
                paused:
                  $ref: "#/components/examples/AssetPausedResponse"
                allowed:
                  $ref: "#/components/examples/AssetResponse"
  /admin/fees:
    get:
      summary: Get trading fee settings
      responses:
        "200":
          description: Fee settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/FeeSettingsResponse"
    patch:
      summary: Update trading fee settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyFeePercent:
                  type: number
                  example: 1
                sellFeePercent:
                  type: number
                  example: 1.2
                swapFeePercent:
                  type: number
                  example: 0.8
                withdrawalFlatUsd:
                  type: number
                  example: 2
                spreadPercent:
                  type: number
                  example: 0.4
      responses:
        "200":
          description: Fee settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/FeeSettingsResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Symbol:
      in: path
      name: symbol
      required: true
      schema:
        type: string
      example: BTC
  examples:
    HealthResponse:
      summary: Healthy API
      value:
        status: ok
        service: crypto-trade-api
