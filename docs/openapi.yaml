      example: BTC
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Optional retry-safety key for sensitive POST requests. Reusing the same key with the same body replays the original successful response; using it with a different body returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
      example: class-demo-quote-001
