openapi: 3.0.3
info:
  title: Crypto Trade API
  version: 1.0.0
  description: Sandbox crypto trading API for students. Covers market data, wallets, buy, sell, swap, transactions, KYC, and admin operations.
servers:
  - url: /
    description: Current API host
  - url: http://localhost:4200
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health checks and service metadata.
  - name: Auth
    description: Registration, login, OTP, authenticator 2FA, and KYC submission.
  - name: Market
    description: Asset catalog, trending assets, and simulated live market prices.
  - name: Profile
    description: Customer profile, settings, watchlist, devices, and notifications.
  - name: Wallet
    description: Wallet balances, deposits, withdrawals, and transaction history.
  - name: Trade
    description: Quote preview and trade execution for buy, sell, and swap flows.
  - name: Admin
    description: Admin dashboard, users, KYC review, withdrawals, assets, and fees.
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: Check server health
      responses:
        "200":
          description: API status
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/HealthResponse"
  /assets/{fileName}:
    get:
      tags: [System]
      security: []
      summary: Get a backend-hosted crypto logo SVG
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
          example: btc.svg
      responses:
        "200":
          description: SVG logo file
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  example: student@cryptoclass.test
                phone:
                  type: string
                  description: International phone number in E.164 format.
                  example: "+2348010000001"
                password:
                  type: string
                  minLength: 8
                  example: password123
      responses:
        "201":
          description: User, access token, and refresh token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginType, identifier, password]
              properties:
                loginType:
                  type: string
                  enum: [email, phone]
                  description: Tells the API whether identifier should be matched against email or phone.
                  example: email
                identifier:
                  type: string
                  description: Email address when loginType is email, or phone number when loginType is phone.
                  example: student@cryptoclass.test
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: User tokens, or a 2FA challenge
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
                twoFactorRequired:
                  $ref: "#/components/examples/TwoFactorChallengeResponse"
  /auth/session:
    get:
      tags: [Auth]
      summary: Check the current bearer token session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      authenticated: true
                      user:
                        id: usr_student
                        fullName: Ada Student
                        email: student@cryptoclass.test
                        role: customer
                      accessToken: demo-user-token
                      token: demo-user-token
                      refreshToken: demo-user-refresh-token
                      tokenType: Bearer
                      expiresAt: "2099-01-01T00:00:00.000Z"
                      expiresInSeconds: 2300000000
                      refreshTokenExpiresAt: "2099-01-31T00:00:00.000Z"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current bearer token
      responses:
        "200":
          description: Logout status
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      loggedOut: true
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate tokens with a refresh token
      description: Returns a new access token and a new refresh token. The previous refresh token is no longer valid after this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: demo-user-refresh-token
      responses:
        "200":
          description: New tokens for the same user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Start authenticator app setup
      responses:
        "200":
          description: TOTP secret and QR URI
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorSetupResponse"
  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable authenticator app 2FA
      description: Returns one-time recovery codes. Store them on the client or show them once to the user; the API stores only hashed versions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorEnabledResponse"
  /auth/2fa/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify a login 2FA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId]
              properties:
                challengeId:
                  type: string
                  example: 2fa_abc123
                code:
                  type: string
                  example: "123456"
                recoveryCode:
                  type: string
                  description: Use one recovery code instead of an authenticator code when the user lost their authenticator app.
                  example: "A1B2C-D3E4F"
      responses:
        "200":
          description: User, access token, and refresh token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AuthResponse"
  /auth/2fa/recovery-codes/regenerate:
    post:
      tags: [Auth]
      summary: Regenerate 2FA recovery codes
      description: Invalidates all old recovery codes and returns a fresh set. Requires password plus a current authenticator code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                  example: password123
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Fresh recovery codes
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorRecoveryCodesResponse"
  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable authenticator app 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: password123
                code:
                  type: string
                  example: "123456"
                recoveryCode:
                  type: string
                  example: "A1B2C-D3E4F"
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TwoFactorDisabledResponse"
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Request demo OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: student@cryptoclass.test
      responses:
        "200":
          description: Demo OTP code
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/OtpRequestResponse"
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify demo OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: student@cryptoclass.test
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/OtpVerifyResponse"
  /auth/kyc:
    post:
      tags: [Auth]
      summary: Submit KYC for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, country, documentType, documentNumber]
              properties:
                legalName:
                  type: string
                  example: Ada Student
                country:
                  type: string
                  example: Nigeria
                documentType:
                  type: string
                  enum: [national_id, passport, drivers_license]
                  example: national_id
                documentNumber:
                  type: string
                  example: NIN-000-000
                selfieImageUrl:
                  type: string
                  example: https://example.com/uploads/ada-selfie.jpg
                documentImageUrl:
                  type: string
                  example: https://example.com/uploads/ada-national-id.jpg
      responses:
        "201":
          description: KYC submission
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/KycResponse"
  /auth/kyc/uploads:
    post:
      tags: [Auth]
      summary: Create KYC upload instructions
      description: Returns demo local upload instructions by default, or signed Cloudinary direct-upload instructions when Cloudinary environment variables are configured. Cloudinary uploads are grouped by user in kyc/{userId}/{documentKind}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType]
              properties:
                fileName:
                  type: string
                  example: student-national-id.png
                contentType:
                  type: string
                  example: image/png
                documentKind:
                  type: string
                  enum: [selfie, document_front, document_back]
                  example: document_front
      responses:
        "201":
          description: Upload instructions
          content:
            application/json:
              examples:
                demoStorage:
                  value:
                    data:
                      uploadId: upload_abc123
                      provider: demo_local_storage
                      storageKey: kyc/usr_student/document_front/upload_abc123-student-national-id.png
                      uploadUrl: /storage/uploads/kyc/usr_student/document_front/upload_abc123-student-national-id.png
                      publicUrl: /storage/files/kyc/usr_student/document_front/upload_abc123-student-national-id.png
                      method: PUT
                      headers:
                        content-type: image/png
                      expiresAt: "2026-05-20T13:10:00.000Z"
                cloudinary:
                  value:
                    data:
                      uploadId: upload_abc123
                      provider: cloudinary
                      cloudName: dbh1f4yce
                      storageKey: kyc/usr_student/document_front/upload_abc123-student-national-id
                      folder: kyc/usr_student/document_front
                      publicId: kyc/usr_student/document_front/upload_abc123-student-national-id
                      uploadUrl: https://api.cloudinary.com/v1_1/dbh1f4yce/auto/upload
                      publicUrl: https://res.cloudinary.com/dbh1f4yce/image/upload/kyc/usr_student/document_front/upload_abc123-student-national-id
                      method: POST
                      headers: {}
                      formFields:
                        folder: kyc/usr_student/document_front
                        overwrite: "false"
                        public_id: upload_abc123-student-national-id
                        timestamp: 1779282600
                        api_key: "********"
                        signature: "********"
                      expiresAt: "2026-05-20T13:10:00.000Z"
  /market/assets:
    get:
      tags: [Market]
      security: []
      summary: List supported crypto assets
      parameters:
        - in: query
          name: q
          required: false
          description: Optional search text for asset name or symbol.
          schema:
            type: string
          example: btc
        - in: query
          name: search
          required: false
          description: Alias for q, useful for search inputs.
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
          example: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [symbol, priceUsd, change24h, minBuyUsd]
          example: priceUsd
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
          example: desc
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
  /market/assets/{symbol}:
    get:
      tags: [Market]
      security: []
      summary: Get asset details and demo chart data
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetDetailResponse"
  /market/trending:
    get:
      tags: [Market]
      security: []
      summary: List trending assets
      responses:
        "200":
          description: Trending assets
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
  /market/prices:
    get:
      tags: [Market]
      security: []
      summary: List simulated live market prices
      responses:
        "200":
          description: Simulated live price feed
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/PriceFeedResponse"
  /me:
    get:
      tags: [Profile]
      summary: Get current profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/ProfileResponse"
    patch:
      tags: [Profile]
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 80
                  example: Ada Student
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{7,14}$'
                  description: International phone number in E.164 format.
                  example: "+2348010000001"
                avatarUrl:
                  type: string
                  nullable: true
                  example: https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=240&h=240&fit=crop&crop=faces
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/ProfileResponse"
  /me/settings:
    get:
      tags: [Profile]
      summary: Get user settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/SettingsResponse"
    patch:
      tags: [Profile]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                theme:
                  type: string
                  enum: [light, dark, system]
                  example: dark
                pushNotifications:
                  type: boolean
                  example: true
                biometricEnabled:
                  type: boolean
                  example: false
                fiatCurrency:
                  type: string
                  enum: [USD, NGN, EUR, GBP, CAD, AUD, JPY, CHF]
                  example: USD
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/SettingsResponse"
  /me/pin:
    patch:
      tags: [Profile]
      summary: Update transaction PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPin, newPin]
              properties:
                currentPin:
                  type: string
                  example: "0000"
                newPin:
                  type: string
                  minLength: 4
                  maxLength: 6
                  example: "1234"
      responses:
        "200":
          description: PIN updated
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/UpdatedResponse"
  /me/devices:
    post:
      tags: [Profile]
      summary: Register an Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expoPushToken, platform]
              properties:
                expoPushToken:
                  type: string
                  example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
                platform:
                  type: string
                  enum: [ios, android, web]
                  example: ios
      responses:
        "200":
          description: Registered device token
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DeviceTokenResponse"
  /me/watchlist:
    get:
      tags: [Profile]
      summary: List watchlist assets
      responses:
        "200":
          description: Watchlist assets
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/AssetListResponse"
  /me/watchlist/{symbol}:
    post:
      tags: [Profile]
      summary: Add asset to watchlist
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Updated watchlist symbols
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WatchlistSymbolsResponse"
    delete:
      tags: [Profile]
      summary: Remove asset from watchlist
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Updated watchlist symbols
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WatchlistSymbolsResponse"
  /me/price-alerts:
    get:
      tags: [Profile]
      summary: List price alerts
      responses:
        "200":
          description: Price alerts
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      - id: alert_btc_above
                        userId: usr_student
                        assetSymbol: BTC
                        direction: above
                        targetPriceUsd: 70000
                        isActive: true
                        triggeredAt: null
                        createdAt: "2026-05-20T12:00:00.000Z"
                        asset:
                          symbol: BTC
                          name: Bitcoin
                    meta:
                      count: 1
                      active: 1
    post:
      tags: [Profile]
      summary: Create a price alert
      description: If the current simulated price already crosses the target, the alert triggers immediately and creates a notification. Otherwise, it is evaluated during market ticks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetSymbol, direction, targetPriceUsd]
              properties:
                assetSymbol:
                  type: string
                  example: BTC
                direction:
                  type: string
                  enum: [above, below]
                  example: above
                targetPriceUsd:
                  type: number
                  example: 72000
      responses:
        "201":
          description: Created price alert
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      id: alert_abc123
                      userId: usr_student
                      assetSymbol: BTC
                      direction: above
                      targetPriceUsd: 72000
                      isActive: true
                      triggeredAt: null
                      createdAt: "2026-05-20T12:00:00.000Z"
  /me/price-alerts/{alertId}:
    patch:
      tags: [Profile]
      summary: Update a price alert
      parameters:
        - in: path
          name: alertId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                direction:
                  type: string
                  enum: [above, below]
                targetPriceUsd:
                  type: number
                isActive:
                  type: boolean
      responses:
        "200":
          description: Updated price alert
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      id: alert_abc123
                      assetSymbol: BTC
                      direction: above
                      targetPriceUsd: 73000
                      isActive: false
                      triggeredAt: "2026-05-20T12:00:00.000Z"
    delete:
      tags: [Profile]
      summary: Delete a price alert
      parameters:
        - in: path
          name: alertId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      deleted: true
  /me/notifications:
    get:
      tags: [Profile]
      summary: List user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/NotificationsResponse"
  /me/notifications/{notificationId}/read:
    patch:
      tags: [Profile]
      summary: Mark one notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/NotificationResponse"
  /me/notifications/read-all:
    patch:
      tags: [Profile]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Update status
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/UpdatedResponse"
  /wallet:
    get:
      tags: [Wallet]
      summary: Get wallet balances and portfolio value
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/WalletResponse"
  /wallet/portfolio/history:
    get:
      tags: [Wallet]
      summary: Get portfolio chart history
      parameters:
        - in: query
          name: range
          required: false
          schema:
            type: string
            enum: [1D, 1W, 1M, 1Y]
          example: 1M
      responses:
        "200":
          description: Portfolio chart points
          content:
            application/json:
              examples:
                success:
                  value:
                    data:
                      - time: "2026-05-20T12:00:00.000Z"
                        valueUsd: 8942.32
                        value: 8279.93
                        currency: EUR
                    meta:
                      count: 30
                      range: 1M
                      latestValueUsd: 9011.44
                      latestValue: 8343.93
                      currency: EUR
  /wallet/deposit-addresses:
    get:
      tags: [Wallet]
      summary: List deposit addresses
      responses:
        "200":
          description: Deposit addresses
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DepositAddressesResponse"
  /wallet/deposit-addresses/{symbol}:
    get:
      tags: [Wallet]
      summary: Get a deposit address and QR payload
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Deposit address
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/DepositAddressResponse"
  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: List user transactions
      parameters:
        - in: query
          name: status
          required: false
          description: Optional transaction status filter.
          schema:
            type: string
            enum: [pending, completed, failed, cancelled]
          example: completed
        - in: query
          name: type
          required: false
          description: Optional transaction type filter.
          schema:
            type: string
            enum: [buy, sell, swap, deposit, withdrawal]
          example: buy
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
          example: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
          example: desc
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              examples:
                success:
                  $ref: "#/components/examples/TransactionListResponse"
